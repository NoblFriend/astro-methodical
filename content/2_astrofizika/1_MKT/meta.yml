title: Элементы молекулярно-кинетической теории, термодинамики и статистической физики.
description: В данной части кратко изложены важные для астрофизики результаты термодинамики, молекулярно-кинетической теории и статистической физики. Все они описывают многочастичные системы, самый яркий пример которых --- газы. Газы обладают массой свойств, иллюстрируют фундаментальные физические концепции и регулярно возникают в астрофизических моделях. 