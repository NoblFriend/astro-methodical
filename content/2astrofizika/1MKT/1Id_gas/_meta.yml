title: Идеальный газ и элементы термодинамики.
description: Одна из основных моделей газа --- это газ невзаимодействующих частиц. Она позволяет относительно легко решать огромное число прикладных задач. Также в этой главе изложены элементы термодинамики, преимущественно приложенной к изучению идеального газа.
